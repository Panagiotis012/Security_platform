global:
  resolve_timeout: 5m

route:
  receiver: webhook
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: webhook
    webhook_configs:
      - url: "__ALERT_WEBHOOK_URL__"
        send_resolved: true

inhibit_rules:
  - source_matchers: ["severity=critical"]
    target_matchers: ["severity=~warning|high"]
    equal: ["alertname", "job"]

