apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-telemetry
  labels:
    app: telemetry
    app.kubernetes.io/name: telemetry
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: observability
spec:
  replicas: {{ .Values.telemetry.replicaCount }}
  selector:
    matchLabels:
      app: telemetry
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: telemetry
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telemetry
          image: "{{ .Values.telemetry.image.repository }}:{{ .Values.telemetry.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.telemetry.service.port }}
              name: http
          env:
            - name: NODE_ENV
              value: {{ .Values.global.nodeEnv }}
            - name: PORT
              value: "{{ .Values.telemetry.service.port }}"
            - name: LOG_LEVEL
              value: {{ .Values.global.logLevel }}
            - name: DETECTION_INTERVAL_MS
              value: "{{ .Values.telemetry.detectionIntervalMs }}"
            - name: ALERT_WEBHOOK_URL
              value: {{ .Values.telemetry.alerting.webhookUrl | quote }}
          resources:
            {{- toYaml .Values.telemetry.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.telemetry.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.telemetry.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: audit-data
              mountPath: /data/audit
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: audit-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-audit-logs
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-telemetry
spec:
  type: {{ .Values.telemetry.service.type }}
  ports:
    - port: {{ .Values.telemetry.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app: telemetry
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-audit-logs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
