apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-policy-engine
  labels:
    app: policy-engine
    app.kubernetes.io/name: policy-engine
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: authorization
spec:
  replicas: {{ .Values.policyEngine.replicaCount }}
  selector:
    matchLabels:
      app: policy-engine
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: policy-engine
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: policy-engine
          image: "{{ .Values.policyEngine.image.repository }}:{{ .Values.policyEngine.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.policyEngine.service.port }}
              name: http
          env:
            - name: NODE_ENV
              value: {{ .Values.global.nodeEnv }}
            - name: PORT
              value: "{{ .Values.policyEngine.service.port }}"
            - name: LOG_LEVEL
              value: {{ .Values.global.logLevel }}
            - name: DEFAULT_DECISION
              value: {{ .Values.policyEngine.defaultDecision }}
            - name: TELEMETRY_URL
              value: "http://{{ .Release.Name }}-telemetry:{{ .Values.telemetry.service.port }}"
          resources:
            {{- toYaml .Values.policyEngine.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.policyEngine.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.policyEngine.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-policy-engine
spec:
  type: {{ .Values.policyEngine.service.type }}
  ports:
    - port: {{ .Values.policyEngine.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app: policy-engine
    app.kubernetes.io/instance: {{ .Release.Name }}
